<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>PS2 Ports</title>
  <link rel="stylesheet" href="ps2-osdsys.css" />
</head>
<body>
  <main class="ps2-screen" data-ps2-portfolio>
    <div class="ps2-site-title" aria-label="XVX PS2 Ports">XVX - PS2 PORTS</div>
    <div class="ps2-ambient" aria-hidden="true">
      <span class="ps2-light ps2-light--a"></span>
      <span class="ps2-light ps2-light--b"></span>
      <span class="ps2-light ps2-light--c"></span>
      <span class="ps2-thread ps2-thread--a"></span>
      <span class="ps2-thread ps2-thread--b"></span>
    </div>

    <section class="ps2-stage ps2-stage--main" aria-label="PlayStation 2 ports portfolio">
      <nav class="ps2-menu" aria-label="Projects">
        <button type="button" tabindex="-1" class="ps2-menu-item is-selected" data-project="project-2004sp">
          <span class="ps2-menu-title">Loading...</span>
          <span class="ps2-menu-subtitle"></span>
        </button>
        <button type="button" tabindex="-1" class="ps2-menu-item" data-project="project-nzp">
          <span class="ps2-menu-title">Loading...</span>
          <span class="ps2-menu-subtitle"></span>
        </button>
        <button type="button" tabindex="-1" class="ps2-menu-item" data-project="project-goat">
          <span class="ps2-menu-title">Loading...</span>
          <span class="ps2-menu-subtitle"></span>
        </button>
        <button type="button" tabindex="-1" class="ps2-menu-item" data-project="project-minecraft">
          <span class="ps2-menu-title">Loading...</span>
          <span class="ps2-menu-subtitle"></span>
        </button>
      </nav>
    </section>

    <section class="ps2-stage ps2-stage--detail" aria-live="polite" aria-hidden="true">
      <article class="ps2-project" id="project-2004sp" aria-hidden="true">
        <div class="ps2-project-heading">
          <p class="ps2-project-eyebrow">PlayStation 2 Port</p>
          <h1>2004SP</h1>
        </div>
        <nav class="ps2-submenu" aria-label="2004SP information">
          <button type="button" tabindex="-1" class="is-selected" data-md="content/2004sp/overview.md">Overview</button>
          <button type="button" tabindex="-1" data-md="content/2004sp/links.md">Links</button>
        </nav>
        <div class="ps2-detail-copy"><div class="ps2-markdown" data-md-target></div></div>
      </article>

      <article class="ps2-project" id="project-nzp" aria-hidden="true">
        <div class="ps2-project-heading">
          <p class="ps2-project-eyebrow">PlayStation 2 Port</p>
          <h1>NZ:P</h1>
        </div>
        <nav class="ps2-submenu" aria-label="NZ:P information">
          <button type="button" tabindex="-1" class="is-selected" data-md="content/nzp/overview.md">Overview</button>
          <button type="button" tabindex="-1" data-md="content/nzp/links.md">Links</button>
        </nav>
        <div class="ps2-detail-copy"><div class="ps2-markdown" data-md-target></div></div>
      </article>

      <article class="ps2-project" id="project-goat" aria-hidden="true">
        <div class="ps2-project-heading">
          <p class="ps2-project-eyebrow">PlayStation 2 Port</p>
          <h1>Project GOAT</h1>
        </div>
        <nav class="ps2-submenu" aria-label="Project GOAT information">
          <button type="button" tabindex="-1" class="is-selected" data-md="content/project-goat/overview.md">Overview</button>
          <button type="button" tabindex="-1" data-md="content/project-goat/links.md">Links</button>
        </nav>
        <div class="ps2-detail-copy"><div class="ps2-markdown" data-md-target></div></div>
      </article>

      <article class="ps2-project" id="project-minecraft" aria-hidden="true">
        <div class="ps2-project-heading">
          <p class="ps2-project-eyebrow">PlayStation 2 Port</p>
          <h1>Minecraft</h1>
        </div>
        <nav class="ps2-submenu" aria-label="Minecraft information">
          <button type="button" tabindex="-1" class="is-selected" data-md="content/minecraft/overview.md">Overview</button>
          <button type="button" tabindex="-1" data-md="content/minecraft/links.md">Links</button>
        </nav>
        <div class="ps2-detail-copy"><div class="ps2-markdown" data-md-target></div></div>
      </article>
    </section>

    <footer class="ps2-footer">
      <span class="ps2-hint ps2-hint--select" aria-hidden="true"><span class="ps2-symbol ps2-symbol--x">×</span><span>Select</span></span>
      <button type="button" tabindex="-1" class="ps2-back-button" data-ps2-back>
        <span class="ps2-symbol ps2-symbol--circle">○</span><span>Back</span>
      </button>
      <span class="ps2-hint ps2-hint--mouse" aria-hidden="true"><span class="ps2-mouse-mark">●</span><span>Mouse</span></span>
    </footer>
  </main>

  <script src="ps2-osdsys.js"></script>
</body>
</html>
