<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title></title>
  <link rel="stylesheet" href="ps2-osdsys.css" />
</head>
<body>
  <main class="ps2-screen" data-ps2-portfolio>
    <div class="ps2-site-title" data-site-title></div>

    <div class="ps2-ambient" aria-hidden="true">
      <span class="ps2-light ps2-light--a"></span>
      <span class="ps2-light ps2-light--b"></span>
      <span class="ps2-light ps2-light--c"></span>
      <span class="ps2-thread ps2-thread--a"></span>
      <span class="ps2-thread ps2-thread--b"></span>
    </div>

    <section class="ps2-stage ps2-stage--main">
      <nav class="ps2-menu" data-project-menu></nav>
    </section>

    <section class="ps2-stage ps2-stage--detail" aria-live="polite" aria-hidden="true"></section>

    <footer class="ps2-footer">
      <span class="ps2-hint ps2-hint--select" aria-hidden="true">
        <span class="ps2-symbol ps2-symbol--x">×</span><span data-ui-select-label></span>
      </span>
      <button type="button" tabindex="-1" class="ps2-back-button" data-ps2-back>
        <span class="ps2-symbol ps2-symbol--circle">○</span><span data-ui-back-label></span>
      </button>
      <span class="ps2-hint ps2-hint--mouse" aria-hidden="true">
        <span class="ps2-mouse-mark">●</span><span data-ui-input-label></span>
      </span>
    </footer>
  </main>

  <script src="ps2-osdsys.js"></script>
</body>
</html>
